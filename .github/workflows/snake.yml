name: Gerar animação de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-animation
  cancel-in-progress: true

jobs:
  generate:
    name: Gerar a cobrinha de contribuições
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar animação clara, escura e GIF
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2f81f7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff
            dist/github-contribution-grid-snake.gif?palette=github-dark&color_snake=#58a6ff&color_background=#0d1117
      - name: Publicar os arquivos na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
